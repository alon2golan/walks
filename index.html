<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2e6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="דוגיסיטר">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>דוגיסיטר</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#f6f7f5;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:system-ui,Arial,sans-serif;color:#6b776d}
</style>
</head>
<body>
<div id="fallback">טוען…</div>
<!-- האפליקציה עצמה רצה ב-Google Apps Script; הדף הזה רק מציג אותה במסך מלא.
     אבטחה:
     • קישור הצטרפות ‎#t=…‎ — החלק שאחרי # לא נשלח לאף שרת, ונמחק משורת הכתובת מיד.
       הקוד חד-פעמי: בשימוש הראשון השרת מחליף אותו במפתח מכשיר, והקישור מפסיק לעבוד.
     • מפתח המכשיר נשמר רק במכשיר ומועבר לאפליקציה ב-postMessage, רק לחלון שבתוך ה-iframe שלנו
       ורק לדומיין של Google — אף פעם לא בכתובת URL. בגיליון נשמר רק hash שלו. -->
<iframe id="app" title="דוגיסיטר" allow="clipboard-write" referrerpolicy="no-referrer"
  onload="var f=document.getElementById('fallback'); if(f) f.remove()"></iframe>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbzd1K9hn0MMQs__kBtv9ujMBBuzE4I1PR8kT9cMJdqx__JxlngdX3TZAXgiilneYg0/exec';
  var K = 'dogsitterKey', OK = /^[A-Za-z0-9]{32,80}$/;
  var GOOG = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
  var m = location.hash.match(/[#&]t=([A-Za-z0-9]{32,80})/), token = m ? m[1] : '';
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  var key = '';
  try { localStorage.removeItem('dogsitterPin'); key = localStorage.getItem(K) || ''; } catch (e) {}
  var frame = document.getElementById('app');

  // האם ההודעה הגיעה מחלון שנמצא בתוך ה-iframe שלנו (ולא מחלון אחר)?
  function insideOurFrame(w) {
    function walk(win, depth) {
      if (win === w) return true;
      if (depth > 3) return false;
      try { for (var i = 0; i < win.frames.length; i++) if (walk(win.frames[i], depth + 1)) return true; } catch (e) {}
      return false;
    }
    return walk(frame.contentWindow, 0);
  }

  window.addEventListener('message', function (e) {
    if (!GOOG.test(e.origin) || !insideOurFrame(e.source)) return;
    var d = e.data || {};
    if (d.type === 'dogsitter-ready') {
      e.source.postMessage({ type: 'dogsitter-auth', key: key, token: token }, e.origin);
      token = '';                                  // קוד ההצטרפות נשלח פעם אחת בלבד
    } else if (d.type === 'dogsitter-save' && OK.test(d.key)) {
      key = d.key; try { localStorage.setItem(K, key); } catch (x) {}
    } else if (d.type === 'dogsitter-clear') {
      key = ''; try { localStorage.removeItem(K); } catch (x) {}
    }
  });

  // קישור שהודבק בלשונית שכבר פתוחה: הדפדפן משנה רק את ה-# בלי לטעון מחדש, אז טוענים בעצמנו
  window.addEventListener('hashchange', function () {
    if (/[#&]t=[A-Za-z0-9]{32,80}/.test(location.hash)) location.reload();
  });

  frame.src = EXEC;                                // בלי מפתח בכתובת
})();
</script>
</body>
</html>
